[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napariTFM"
version = "1.0.0"
description = "A napari plugin for Traction Force Microscopy analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENCE"]
authors = [
    {name = "Artur Ruppel", email = "artur@ruppel.pro"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: napari",
]
dependencies = [
    "napari[pyqt]>=0.7.0",
    "scipy>=1.9.3",
    "scikit-image>=0.24.0",
    "openpiv>=0.25",
    "numpy>=1.25.2",
    "opencv-python>=4.8.0",
    "tifffile>=2024.6.18",
    "pyyaml>=6.0.2",
    "numba>=0.60.0",
    "imageio>=2.36.1",
    "imageio-ffmpeg>=0.5.1",
    "matplotlib>=3.9.4",
    "qtpy>=2.4.1",
    "qtrangeslider>=0.1.5",
    "vispy>=0.14.3",
    "pandas>=2.2.3",
    "pyarrow>=14.0.0",
    "tqdm>=4.66.5",
]

[project.optional-dependencies]
# GPU acceleration for the displacement backends. The defaults (openpiv for PIV,
# scikit-image for Lucas-Kanade) need no extra; installing this lets
# disp_device="auto"/"cuda" run the torch GPU ports on a CUDA device, and enables
# the GPU-only FFD method. "piv" is kept as a backward-compatible alias.
gpu = [
    "torch>=2.0",
]
piv = [
    "torch>=2.0",
]
testing = [
    "pytest",
    "pytest-qt",
]

[project.urls]
Homepage = "https://github.com/ArturRuppel/napariTFM"
Repository = "https://github.com/ArturRuppel/napariTFM"
"Bug Tracker" = "https://github.com/ArturRuppel/napariTFM/issues"

[project.entry-points."napari.manifest"]
napariTFM = "napariTFM:napari.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_dev", "_validation"]

[tool.setuptools.packages.find]
include = ["napariTFM*"]

[tool.setuptools.package-data]
"napariTFM" = ["*.yaml"]

[tool.pylint.messages_control]
disable = [
    "import-error",
    "no-name-in-module", 
    "import-outside-toplevel",
    "broad-except",
    "trailing-whitespace",
    "missing-function-docstring"
]
